name: Desktop packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: npm ci
      - run: python -m pip install -r engine/requirements.txt
      - run: npm run check
      - run: npm test
      - run: npm run test:engine
      - run: npm run licenses
      - run: npm run build:engine
      - name: Check engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./engine-dist/spotdl-engine.exe --version
          else
            ./engine-dist/spotdl-engine --version
          fi
      - run: python scripts/smoke_engine.py
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Free-Spotify-Downloader-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --draft --title "Free Spotify Downloader $GITHUB_REF_NAME" --generate-notes
